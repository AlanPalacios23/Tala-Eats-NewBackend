name: RC4 Kali isolated stage - script security & NO-GO
on:
  push:
    branches:
      - 'release/core-v2-rc4-kali-isolated-stage'
  pull_request:
    paths:
      - 'deploy/kali-core-v2-rc4-isolated-lab.sh'
      - 'docs/CORE-V2-RC4-KALI-ISOLATED-STAGE.md'
      - '.github/workflows/core-v2-rc4-kali-stage-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-preflight-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject unsafe staging runner syntax or public exposure
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/kali-core-v2-rc4-isolated-lab.sh
          script=deploy/kali-core-v2-rc4-isolated-lab.sh
          grep -Fq -- '--network none' "$script"
          grep -Fq -- '--network "container:$PG_CONTAINER"' "$script"
          grep -Fq -- 'docker volume create --label "$LABEL"' "$script"
          grep -Fq -- 'NODE_ENV=test' "$script"
          if grep -Eq -- '(^|[[:space:]])(--publish|--network host|-p [0-9])' "$script"; then
            echo "RC4_STAGE_PUBLIC_EXPOSURE_FORBIDDEN"
            exit 1
          fi
      - name: Validate release policy and source tree against Git SHA
        run: |
          node modules/integration/scripts/verify-snapshots.mjs
          node --test tests/release-gates.test.mjs
          node scripts/verify-core-v2-preprod.mjs
      - name: CLI plan must be read-only and bad approval must fail
        shell: bash
        run: |
          set -Eeuo pipefail
          bash deploy/kali-core-v2-rc4-isolated-lab.sh --plan | tee /tmp/rc4-plan.txt
          grep -Fq 'PUBLIC_PORTS=0' /tmp/rc4-plan.txt
          grep -Fq 'PRODUCTION_MUTATIONS=0' /tmp/rc4-plan.txt
          if bash deploy/kali-core-v2-rc4-isolated-lab.sh --apply \
            0000000000000000000000000000000000000000 NOT_APPROVED; then
            echo 'RC4_STAGE_APPROVAL_BYPASS'
            exit 1
          fi
          if bash deploy/kali-core-v2-rc4-isolated-lab.sh --cleanup NOT_APPROVED; then
            echo 'RC4_STAGE_CLEANUP_APPROVAL_BYPASS'
            exit 1
          fi
          echo 'RC4_STAGE_STATIC_GATES_PASS_NO_LIVE_DEPLOY'
