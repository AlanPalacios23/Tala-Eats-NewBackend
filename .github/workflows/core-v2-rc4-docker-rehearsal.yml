name: RC4 isolated Docker rehearsal (not Kali, no LIVE)
on:
  push:
    branches:
      - 'release/core-v2-rc4-kali-isolated-stage'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read-only stage plan
        run: bash deploy/kali-core-v2-rc4-isolated-lab.sh --plan
      - name: Rehearse exact SHA in disposable Docker only
        run: |
          set -Eeuo pipefail
          bash deploy/kali-core-v2-rc4-isolated-lab.sh --apply \
            "$(git rev-parse HEAD)" \
            I_APPROVE_CORE_V2_RC4_ISOLATED_LAB_ONLY
      - name: Stop and remove only isolated rehearsal resources
        if: always()
        run: |
          bash deploy/kali-core-v2-rc4-isolated-lab.sh --cleanup \
            I_APPROVE_CORE_V2_RC4_ISOLATED_LAB_ONLY
      - name: Explicit boundary
        if: always()
        run: |
          echo "LINUX_DOCKER_REHEARSAL_ONLY; NOT KALI; NOT REMOTE_STRIPE_TEST"
          echo "CORE_V2_COMMERCIAL_READY=false"
