name: M8 Pagos — isolated Stripe TEST and mock-provider LAB
on:
  push:
    branches: ['feat/core-v2-pagos-foundation']
    paths:
      - 'modules/payments/**'
      - 'docs/MODULO8-PAGOS-ARQUITECTURA.md'
      - 'docs/MODULO8-PAGOS-LAB1.md'
      - 'docs/MODULO8-PAGOS-LAB2-STRIPE-TEST.md'
      - '.github/workflows/module8-payments-ci.yml'
  pull_request:
    paths:
      - 'modules/payments/**'
      - 'docs/MODULO8-PAGOS-ARQUITECTURA.md'
      - 'docs/MODULO8-PAGOS-LAB1.md'
      - '.github/workflows/module8-payments-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payments-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payment_lab
          POSTGRES_PASSWORD: only_for_m8_ci
          POSTGRES_DB: tala_payments_v2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U payment_lab -d tala_payments_v2_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install only M8 dependencies
        working-directory: modules/payments
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript strict and pure validation
        working-directory: modules/payments
        run: npm run check
      - name: Enforce import and network-provider boundaries
        run: |
          if grep -RE 'from .*modules/(orders|logistics|finance|users|notifications|restaurants|locations)' modules/payments/src; then
            echo 'M8 illegally imports another module'
            exit 1
          fi
          if grep -RE '(sk_live_|rk_live_|/v1/transfers|/v1/payouts|/v1/charges)' modules/payments/src; then
            echo 'M8 LAB must never access Stripe LIVE or payout/charge endpoints'
            exit 1
          fi
      - name: Apply M8 SQL only to test DB
        env:
          PGPASSWORD: only_for_m8_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U payment_lab \
            -d tala_payments_v2_test \
            -f modules/payments/migrations/001_payments_foundation.sql
      - name: Apply Stripe TEST-only M8 migration
        env:
          PGPASSWORD: only_for_m8_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U payment_lab \
            -d tala_payments_v2_test \
            -f modules/payments/migrations/002_stripe_test_gateway.sql
      - name: Full PostgreSQL 16, concurrency and HTTP E2E suites
        env:
          PAYMENTS_CI_URL: postgresql://payment_lab:only_for_m8_ci@127.0.0.1:5432/tala_payments_v2_test
        working-directory: modules/payments
        run: npm test
      - name: Refuse migration to unrelated PostgreSQL database
        env:
          PGPASSWORD: only_for_m8_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U payment_lab \
            -d postgres -c 'CREATE DATABASE unrelated_m8_test'
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U payment_lab \
            -d unrelated_m8_test \
            -f modules/payments/migrations/001_payments_foundation.sql; then
            echo 'M8 SQL escaped isolated lab database'
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U payment_lab \
            -d unrelated_m8_test \
            -f modules/payments/migrations/002_stripe_test_gateway.sql; then
            echo 'M8 Stripe TEST migration escaped isolated lab database'
            exit 1
          fi
          test "$(psql -At -h 127.0.0.1 -U payment_lab \
            -d unrelated_m8_test \
            -c "SELECT to_regnamespace('tala_payments_v2') IS NULL")" = "t"
