name: M3 Finance isolated LAB
on:
  pull_request:
    paths:
      - 'modules/finance/**'
      - 'docs/MODULO3-FINANZAS-ARQUITECTURA.md'
      - '.github/workflows/module3-finance-ci.yml'
  push:
    branches:
      - 'feat/core-v2-finanzas-foundation'
    paths:
      - 'modules/finance/**'
      - 'docs/MODULO3-FINANZAS-ARQUITECTURA.md'
      - '.github/workflows/module3-finance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance_lab
          POSTGRES_PASSWORD: finance_lab_test_only
          POSTGRES_DB: tala_finance_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_lab -d tala_finance_v2_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install standalone M3 dependencies (never root M1/M2)
        working-directory: modules/finance
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Pure finance, signatures and money integrity tests
        run: |
          cd modules/finance
          npm run check
      - name: Apply isolated finance migration
        env:
          PGPASSWORD: finance_lab_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U finance_lab -d tala_finance_v2_test \
            -f modules/finance/migrations/001_finance_foundation.sql
      - name: Apply durable Stripe TEST finance inbox migration
        env:
          PGPASSWORD: finance_lab_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U finance_lab -d tala_finance_v2_test             -f modules/finance/migrations/002_test_webhook_inbox.sql
      - name: Enforce receipt to journal and intent cross-order integrity
        env:
          PGPASSWORD: finance_lab_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U finance_lab -d tala_finance_v2_test \
            -f modules/finance/migrations/003_receipt_integrity.sql
      - name: Signed Stripe TEST webhook idempotency and concurrency integration
        env:
          FINANCE_CI_URL: postgresql://finance_lab:finance_lab_test_only@127.0.0.1:5432/tala_finance_v2_test
        working-directory: modules/finance
        run: node --test tests/stripe-integration.test.mjs
      - name: Read-only reconciliation and anomaly regression
        env:
          FINANCE_CI_URL: postgresql://finance_lab:finance_lab_test_only@127.0.0.1:5432/tala_finance_v2_test
        working-directory: modules/finance
        run: node --test tests/reconciliation.test.mjs
      - name: PostgreSQL ledger double-entry and immutability regression
        env:
          PGPASSWORD: finance_lab_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U finance_lab -d tala_finance_v2_test \
            -f modules/finance/tests/schema.sql
      - name: Reject finance migration on unrelated disposable DB
        env:
          PGPASSWORD: finance_lab_test_only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U finance_lab -d postgres \
            -c 'CREATE DATABASE unrelated_lab'
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U finance_lab -d unrelated_lab \
             -f modules/finance/migrations/001_finance_foundation.sql; then
            echo 'ERROR: migration bypassed FINANCE_LAB_ONLY guard'
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U finance_lab -d unrelated_lab \
            -f modules/finance/migrations/002_test_webhook_inbox.sql; then
            echo 'ERROR: migration 002 bypassed FINANCE_LAB_ONLY guard'
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U finance_lab -d unrelated_lab \
            -f modules/finance/migrations/003_receipt_integrity.sql; then
            echo 'ERROR: migration 003 bypassed FINANCE_LAB_ONLY guard'
            exit 1
          fi
          test "$(psql -At -h 127.0.0.1 -U finance_lab -d unrelated_lab \
            -c "SELECT to_regnamespace('tala_finance_v2') IS NULL")" = "t"
