name: M6 Restaurantes — standalone LAB
on:
  push:
    branches: ['feat/core-v2-restaurantes-foundation']
    paths: ['modules/restaurants/**', '.github/workflows/module6-restaurants-ci.yml', 'docs/MODULO6-RESTAURANTES-ARQUITECTURA.md', 'docs/MODULO6-RESTAURANTES-LAB5-INVENTARIO-SUCURSAL.md', 'docs/MODULO6-RESTAURANTES-CIERRE-LAB6.md']
  pull_request:
    paths: ['modules/restaurants/**', '.github/workflows/module6-restaurants-ci.yml', 'docs/MODULO6-RESTAURANTES-ARQUITECTURA.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restaurants-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: merchant_lab
          POSTGRES_PASSWORD: only_for_m6_ci
          POSTGRES_DB: tala_restaurants_v2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U merchant_lab -d tala_restaurants_v2_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated M6 dependencies
        working-directory: modules/restaurants
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check strict TypeScript and pure validations
        working-directory: modules/restaurants
        run: npm run check
      - name: Enforce isolated module import boundary
        run: |
          if grep -RE 'from .*(modules/(orders|logistics|finance|users|notifications|payments)|stripe|checkout)' modules/restaurants/src; then
            echo "M6 cannot import any other business module or billing provider"
            exit 1
          fi
      - name: Apply merchant LAB migration on PostgreSQL 16
        env:
          PGPASSWORD: only_for_m6_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d tala_restaurants_v2_test \
            -f modules/restaurants/migrations/001_stores_catalog.sql
      - name: Apply inventory append-only and reason consistency controls
        env:
          PGPASSWORD: only_for_m6_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d tala_restaurants_v2_test \
            -f modules/restaurants/migrations/002_stock_integrity.sql
      - name: Apply branch exceptional closure windows migration
        env:
          PGPASSWORD: only_for_m6_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d tala_restaurants_v2_test \
            -f modules/restaurants/migrations/003_branch_closures.sql
      - name: Apply tenant-scoped per-branch menu controls migration
        env:
          PGPASSWORD: only_for_m6_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d tala_restaurants_v2_test \
            -f modules/restaurants/migrations/004_branch_catalog_controls.sql
      - name: Apply per-branch physical inventory and immutable movement ledger
        env:
          PGPASSWORD: only_for_m6_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d tala_restaurants_v2_test \
            -f modules/restaurants/migrations/005_branch_physical_stock.sql
      - name: Apply merchant-only stock transfer and physical count migration
        env:
          PGPASSWORD: only_for_m6_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d tala_restaurants_v2_test \
            -f modules/restaurants/migrations/006_branch_inventory_operations.sql
      - name: Apply split/overnight merchant schedules and preparation settings
        env:
          PGPASSWORD: only_for_m6_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d tala_restaurants_v2_test \
            -f modules/restaurants/migrations/007_branch_schedule_preparation.sql
      - name: Integration, RBAC, version conflicts and immutable ledger
        env:
          RESTAURANTS_CI_URL: postgresql://merchant_lab:only_for_m6_ci@127.0.0.1:5432/tala_restaurants_v2_test
        working-directory: modules/restaurants
        run: npm test
      - name: Reject migration against unrelated databases
        env:
          PGPASSWORD: only_for_m6_ci
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d postgres -c 'CREATE DATABASE m6_unrelated'
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d m6_unrelated \
            -f modules/restaurants/migrations/001_stores_catalog.sql; then
            echo "M6 SQL changed a non-M6 database"
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d m6_unrelated \
            -f modules/restaurants/migrations/002_stock_integrity.sql; then
            echo "M6 inventory migration touched a non-M6 database"
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d m6_unrelated \
            -f modules/restaurants/migrations/003_branch_closures.sql; then
            echo "M6 closures migration touched a non-M6 database"
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d m6_unrelated \
            -f modules/restaurants/migrations/004_branch_catalog_controls.sql; then
            echo "M6 branch menu migration touched a non-M6 database"
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d m6_unrelated \
            -f modules/restaurants/migrations/005_branch_physical_stock.sql; then
            echo "M6 branch stock migration touched a non-M6 database"
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d m6_unrelated \
            -f modules/restaurants/migrations/006_branch_inventory_operations.sql; then
            echo "M6 stock operations migration touched a non-M6 database"
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U merchant_lab \
            -d m6_unrelated \
            -f modules/restaurants/migrations/007_branch_schedule_preparation.sql; then
            echo "M6 schedule/preparation migration touched a non-M6 database"
            exit 1
          fi
          test "$(psql -At -h 127.0.0.1 -U merchant_lab -d m6_unrelated \
            -c "SELECT to_regnamespace('tala_restaurants_v2') IS NULL")" = "t"
